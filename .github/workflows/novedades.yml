# Cada mañana revisa BOE e INAP. Si hay novedades: actualiza la app, la vuelve a publicar
# y abre un aviso (issue) en el repositorio, que GitHub te envía por correo.
name: Novedades de la oposición

on:
  schedule:
    - cron: '30 6 * * *'   # todos los días a las 06:30 UTC (08:30 en la Península en verano, 07:30 en Canarias)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: check
        run: python3 scripts/check_updates.py

      # Opcional: si hay CLAUDE_CODE_OAUTH_TOKEN, Claude (con tu suscripción) lee los documentos y explica
      # qué supone cada novedad para la oposición. Se añade al aviso; si falla, el aviso sale igualmente.
      - name: Explicar las novedades con Claude
        if: steps.check.outputs.has_news == 'true' && env.CLAUDE_TOKEN != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Eres un preparador de la oposición al Cuerpo de Gestión de Sistemas e Informática del Estado (GSI, A2).
            En el archivo novedades.md hay novedades oficiales recién detectadas (BOE e INAP) con sus enlaces.
            Lee cada documento enlazado y AÑADE al final de novedades.md una sección "## Qué significa para ti" con,
            para cada novedad: en 2-4 frases, qué es, a quién afecta, plazos o fechas concretas si los hay
            (inscripción, alegaciones, examen) y qué debería hacer un opositor. No inventes datos: si un
            documento no se puede leer, dilo. Escribe en español. No modifiques ningún otro archivo.
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Edit(novedades.md),Write(novedades.md),WebFetch(domain:www.boe.es),WebFetch(domain:boe.es),WebFetch(domain:sede.inap.gob.es),WebFetch(domain:www.inap.es)"

      - name: Guardar novedades en el repositorio
        run: |
          git config user.name "cuaderno-gsi-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "Novedades: comprobación del $(date -u +%F)"
          git push

      # Los cambios hechos con GITHUB_TOKEN no lanzan otros workflows por sí solos: se lanza la publicación a mano.
      - name: Volver a publicar la app
        if: steps.check.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # GitHub envía por correo los issues nuevos a quien vigila el repositorio (tú, por defecto).
      - name: Avisar con un issue
        if: steps.check.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create novedades --color FFE066 --description "Novedades de la oposición" 2>/dev/null || true
          gh issue create --title "Novedades de la oposición: $(date -u +%d/%m/%Y) (${{ steps.check.outputs.count }})" --body-file novedades.md --label novedades

      # Opcional: correo directo a la dirección que quieras. Configura los secretos MAIL_SERVER, MAIL_PORT,
      # MAIL_USERNAME, MAIL_PASSWORD y MAIL_TO (ver README). Si no existen, este paso se omite.
      - name: Enviar correo
        if: steps.check.outputs.has_news == 'true' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Novedades de la oposición (${{ steps.check.outputs.count }})"
          to: ${{ secrets.MAIL_TO }}
          from: Cuaderno GSI <${{ secrets.MAIL_USERNAME }}>
          html_body: file://novedades.md
          convert_markdown: true
